name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: |
          # Si no existe el wrapper, generarlo
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find & rename APK
        run: |
          APK=$(find app/build/outputs/apk/release/ -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "Error: No se encontró APK"
            find app/build/outputs/ -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK" ./ToDusMessenger-arm64.apk
          echo "APK_SIZE=$(du -h $APK | cut -f1)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDusMessenger-APK
          path: ./ToDusMessenger-arm64.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "ToDus Messenger APK arm64-v8a"
          files: ./ToDusMessenger-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
